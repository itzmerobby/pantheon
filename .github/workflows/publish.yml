name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Synchronize package versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "The version tag must include a version after the v prefix." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          node version-sync.mjs "$VERSION"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: itzmerobby

      - name: Verify NuGet login
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet login did not return an API key. Verify that the NuGet username and the trusted-publishing policy match itzmerobby/pantheon and publish.yml."
            exit 1
          fi

      - name: Pack and publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: node publish.mjs "$PACKAGE_VERSION"
